name: CI

on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  lint-and-build:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OLLAMA_URL: ${{ secrets.OLLAMA_URL || 'http://localhost:11434' }}
      AI_MODEL: ${{ secrets.AI_MODEL || 'llama3.1:8b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  legacy-app:
    name: Legacy App (Typecheck + Test + Build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OLLAMA_URL: ${{ secrets.OLLAMA_URL || 'http://localhost:11434' }}
      AI_MODEL: ${{ secrets.AI_MODEL || 'llama3.1:8b' }}
    defaults:
      run:
        working-directory: legacy-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legacy-app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # NOTE: pas d'étape "Lint" ici. `npm run lint` (next lint) fait remonter des
      # dizaines d'erreurs react-hooks/rules-of-hooks et react/no-unescaped-entities
      # préexistantes dans le code applicatif du fork (hors périmètre de ce lot,
      # qui ne portait que sur le typage du ref et le filet de tests). Ajouter le
      # lint maintenant rendrait ce job rouge en permanence, ce qui est justement
      # le problème qu'on corrige avec cette CI. À traiter dans un lot dédié.
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
      OLLAMA_URL: ${{ secrets.OLLAMA_URL || 'http://localhost:11434' }}
      AI_MODEL: ${{ secrets.AI_MODEL || 'llama3.1:8b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Fork legacy-app (Next 14 / React 18 / Tailwind 3)
  # Depuis les corrections UX du fork, seule la logique métier partagée
  # (src/lib/**, src/types/**, src/components/lineup/**) doit rester
  # identique à legacy-app/src/, hors allowlist déclarée dans
  # scripts/check-legacy-parity.mjs. Le reste de l'UI (app/**, composants
  # hors lineup) est une divergence volontaire du fork, non surveillée.
  # ---------------------------------------------------------------------------
  legacy-parity:
    name: Parité fork legacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Script Node pur (node:fs/path/crypto), aucune dépendance : pas de npm ci.
      - name: Vérifier la parité src/ ↔ legacy-app/src/ (lib, types, components/lineup)
        run: npm run check:legacy-parity
      - name: Aide en cas de dérive
        if: failure()
        run: |
          echo "::error::Le fork legacy-app a divergé de l'app principale sur la logique métier partagée (lib/, types/, components/lineup/)."
          echo "Corrige en lançant 'npm run sync:legacy' puis en committant le résultat."
          echo "Si l'écart est intentionnel, déclare-le dans l'allowlist de scripts/check-legacy-parity.mjs."
          echo "Rappel : l'UI (app/**, composants hors lineup) est hors périmètre, le fork peut y diverger librement."


  legacy-build:
    name: Build fork legacy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: legacy-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OLLAMA_URL: ${{ secrets.OLLAMA_URL || 'http://localhost:11434' }}
      AI_MODEL: ${{ secrets.AI_MODEL || 'llama3.1:8b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legacy-app/package-lock.json
      - run: npm ci
      # Non bloquant : les écarts de signatures de types React 18 vs React 19
      # sont attendus sur le fork (cf. ignoreBuildErrors dans next.config.mjs).
      # L'étape sert de signal de dérive, pas de garde-fou.
      - name: Typecheck legacy (non bloquant)
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Build legacy
        run: npm run build
