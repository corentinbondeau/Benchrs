# ============================================================
# Push to Replicate
# Public ce repo comme modèle Cog « benchrs/video-analysis »
# via cog push, buildé dans le cloud GitHub (aucun Docker local).
#
# Déclencheurs :
#   - manuel (Actions → Run workflow, défaut benchrs/video-analysis)
#   - automatique à chaque push sur main (continuous deployment)
#
# Prérequis : secret GitHub REPLICATE_CLI_AUTH_TOKEN =
#   token Replicate (replicate.com/account → API tokens, préfixe r8_).
# ============================================================
name: Push to Replicate

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Modèle Replicate cible (owner/model)"
        required: false
        default: "benchrs/video-analysis"
# NOTE : Replicate abandonné (pay-per-run). L'analyse vidéo est gérée
# par le worker auto-hébergé (ai-service/worker.py) sur une VM gratuite.
# Ce workflow reste dispo en manuel uniquement, au cas où.

concurrency:
  group: replicate-push
  cancel-in-progress: true

jobs:
  push_to_replicate:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}

      - name: Push to Replicate
        run: cog push r8.im/${{ inputs.model_name || 'benchrs/video-analysis' }}