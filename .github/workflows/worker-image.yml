# ============================================================
# Build & push du worker d'analyse vidéo sur GitHub Container
# Registry (ghcr.io), image ARM64 (shapes Ampere Oracle Free).
#
# La VM n'a plus qu'à docker pull → déploiement quasi instantané.
#
# Déclencheur : push sur main (+ manuel).
# Image : ghcr.io/corentinbondeau/benchrs-worker:arm64
# ============================================================
name: Build ARM worker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai-service/**"
      - ".github/workflows/worker-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (émulation ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/corentinbondeau/benchrs-worker:arm64
            ghcr.io/corentinbondeau/benchrs-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max