# ============================================================
# Cog — modèle Replicate « benchrs/video-analysis »
#
# Empaquète le pipeline d'analyse (ai-service/) en un modèle
# d'API ML externe, exécuté par Replicate (pay-per-run, CPU).
# Aucun démon à maintenir : Vercel lance la prédiction via son
# webhook et écrit le résultat dans video_analyses.
#
# Ce fichier est VOLONTAIREMENT à la racine du dépôt : l'intégration
# GitHub de Replicate lit cog.yaml à la racine (le build embarque
# tout le repo ; predict.py importe ai-service/ relativement).
#
# Déploiement (une seule fois, sur app.replicate.com) :
#   1. org « benchrs » → New model → nom « video-analysis ».
#   2. Model → « Connect a repository » → corentinbondeau/Benchrs
#      (la branche par défaut). Replicate build puis sert le modèle
#      sous https://replicate.com/benchrs/video-analysis.
# ============================================================
build:
  gpu: false
  system_packages:
    - libgl1
    - libglib2.0-0
  python_version: "3.11"
  python_packages:
    - ultralytics>=8.2.0
    - opencv-python>=4.9.0
    - numpy>=1.26.0
    - supervision>=0.21.0
    - python-dotenv>=1.0.0

predict: "replicate/predict.py"
# Une analyse de match bornée (MAX_FRAMES/HARD_TIMEOUT) peut prendre
# plusieurs dizaines de minutes sur CPU.
predict_timeout: 3600