project: benchrs
type: spa
languages: [typescript]
frameworks: [nextjs, react, supabase, tailwindcss, shadcn-ui]
entry_points: [src/app/layout.tsx, src/app/(dashboard)/layout.tsx]

modules:
  app-dashboard:
    path: src/app/(dashboard)/
    description: Dashboard pages — all client-side, each fetches own data via Supabase
    fragment: fragments/app-dashboard.md
    entry_point: layout.tsx
    exports: [DashboardLayout, DashboardPage]
    depends_on: [lib-auth, lib-team, components-layout, components-dashboard]
    routes: [GET /, GET /calendar, GET /chat, GET /roster, GET /stats, GET /tactics, GET /matches/:id, GET /trainings/:id, GET /settings, GET /physical, GET /challenge, GET /season, GET /gallery, GET /championship, GET /club]
    tests: e2e/

  app-auth:
    path: src/app/(auth)/
    description: Auth pages — login, register, join, forgot-password, create-team
    fragment: fragments/app-auth.md
    entry_point: layout.tsx
    exports: [LoginPage, RegisterPage, JoinPage]
    depends_on: [lib-supabase]
    routes: [GET /login, GET /register, GET /join, GET /create-team, GET /forgot-password, GET /reset-password]

  app-api:
    path: src/app/api/
    description: 50+ API Route Handlers — auth, notifications, AI generation, exports, CRUD
    fragment: fragments/app-api.md
    entry_point: null
    exports: []
    depends_on: [lib-supabase, lib-api-auth, lib-training, lib-announcements, lib-challenges]
    routes: [POST /api/auth/*, POST /api/notifications/*, POST /api/trainings/*, POST /api/matches/*, POST /api/announcements/*, POST /api/challenges/*, GET /api/calendar/ics]

  components-dashboard:
    path: src/components/dashboard/
    description: Dashboard widgets — NextEvent, QuickStats, CoachWeekOverview, PlayerDashboard, ParentDashboard
    fragment: fragments/components-dashboard.md
    entry_point: null
    exports: [NextEventCard, QuickStats, CoachWeekOverview, PendingConvocations, PlayerDashboard, ParentDashboard, RecentResults, NewsFeed, SeasonSummary]
    depends_on: [lib-supabase, lib-auth, lib-team, lib-queryCache]

  components-layout:
    path: src/components/layout/
    description: App shell — Sidebar, TopBar, BottomNav (navigation, team switcher)
    fragment: fragments/components-layout.md
    entry_point: null
    exports: [Sidebar, TopBar, BottomNav]
    depends_on: [lib-auth, lib-team, lib-useChatUnread]

  components-match:
    path: src/components/match/
    description: Match-specific components — ratings, MVP, reports, agenda, posters
    fragment: fragments/components-match.md
