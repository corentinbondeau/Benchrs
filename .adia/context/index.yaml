    exports: [MatchReportCard, MatchMvpCard, MatchFeedback, PlayerRatings, MatchPoster, MatchAgenda, RatingStars]
    depends_on: [lib-supabase, lib-auth, lib-team]

  components-training:
    path: src/components/training/
    description: Training components — SessionFiche, ExerciseSchematic, RPE, ExerciseLibrary
    fragment: fragments/components-training.md
    entry_point: null
    exports: [SessionFiche, ExerciseSchematic, SessionRpe, ExerciseLibraryDialog]
    depends_on: [lib-supabase, lib-training]

  components-stats:
    path: src/components/stats/
    description: Player/coach statistics — PlayerProfile, CoachStats, PersonalGoals
    fragment: fragments/components-stats.md
    entry_point: null
    exports: [PlayerProfile, CoachStats, PersonalGoalsCard, SeasonReportCard]
    depends_on: [lib-supabase, lib-auth, lib-team]

  components-ui:
    path: src/components/ui/
    description: shadcn/ui primitives — Button, Card, Dialog, Input, etc. (20 components)
    fragment: fragments/components-ui.md
    entry_point: null
    exports: [Button, Card, Dialog, Input, Select, Tabs, Badge, DropdownMenu, Sheet, Switch]
    depends_on: []

  lib-supabase:
    path: src/lib/supabase/
    description: Supabase client factories — browser (singleton), server, admin
    fragment: fragments/lib-supabase.md
    entry_point: client.ts
    exports: [createClient, getSessionAccessToken, createServerClient, createAdminClient]
    depends_on: []

  lib-auth:
    path: src/lib/auth.tsx
    description: AuthProvider context — user session, profile, signOut, refreshUser
    fragment: fragments/lib-auth.md
    entry_point: auth.tsx
    exports: [AuthProvider, useAuth]
